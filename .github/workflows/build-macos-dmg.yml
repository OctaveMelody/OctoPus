name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach this package to; leave empty for a workflow artifact only
        required: false
        type: string
      source_ref:
        description: Branch, tag, or commit to build; leave empty to use the nearest published release
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build Apple Silicon DMG
    permissions:
      contents: read
    uses: ./.github/workflows/package-artifact.yml
    with:
      package: macos-dmg
      source_ref: ${{ inputs.source_ref }}

  publish:
    name: Attach the DMG to the release
    if: ${{ github.event.inputs.release_tag != '' }}
    needs: package
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release-assets.yml
    with:
      release_tag: ${{ github.event.inputs.release_tag }}
      artifact_pattern: package-macos-dmg

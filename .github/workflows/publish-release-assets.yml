name: Publish package artifacts to a release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing GitHub release tag receiving the packages
        required: true
        type: string
      source_sha:
        description: Immutable source SHA used to build these packages
        required: true
        type: string
      artifact_pattern:
        description: Actions artifact name or pattern to download
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Upload packages to ${{ inputs.release_tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact_pattern }}
          path: packages
          merge-multiple: true
      - name: Attach packages to the existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          python scripts/publish_release_assets.py \
            --repository "$GITHUB_WORKSPACE" \
            --files-directory packages \
            --release-tag "$RELEASE_TAG" \
            --source-sha "$SOURCE_SHA"

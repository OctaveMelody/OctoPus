name: Build all desktop packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach all packages to; leave empty for workflow artifacts only
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.event.release.tag_name || github.event.inputs.release_tag || github.sha }}
  cancel-in-progress: false

jobs:
  macos_dmg:
    name: macOS DMG
    permissions:
      contents: read
    uses: ./.github/workflows/package-artifact.yml
    with:
      package: macos-dmg
      release_event_tag: ${{ github.event.release.tag_name || '' }}

  windows_installer:
    name: Windows installer
    permissions:
      contents: read
    uses: ./.github/workflows/package-artifact.yml
    with:
      package: windows-installer
      release_event_tag: ${{ github.event.release.tag_name || '' }}

  windows_portable:
    name: Windows portable ZIP
    permissions:
      contents: read
    uses: ./.github/workflows/package-artifact.yml
    with:
      package: windows-portable
      release_event_tag: ${{ github.event.release.tag_name || '' }}

  linux_appimage:
    name: Linux AppImage
    permissions:
      contents: read
    uses: ./.github/workflows/package-artifact.yml
    with:
      package: linux-appimage
      release_event_tag: ${{ github.event.release.tag_name || '' }}

  publish:
    name: Attach all packages to the release
    if: ${{ github.event_name == 'release' || github.event.inputs.release_tag != '' }}
    needs: [macos_dmg, windows_installer, windows_portable, linux_appimage]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release-assets.yml
    with:
      release_tag: ${{ github.event.release.tag_name || github.event.inputs.release_tag || '' }}
      artifact_pattern: package-*

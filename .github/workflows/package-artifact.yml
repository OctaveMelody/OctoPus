name: Package one desktop artifact

on:
  workflow_call:
    inputs:
      package:
        description: Package key selected by a caller workflow
        required: true
        type: string
      source_sha:
        description: Immutable commit SHA selected by the caller workflow
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build ${{ inputs.package }}
    runs-on: ${{ inputs.package == 'macos-dmg' && 'macos-26' || (inputs.package == 'windows-installer' || inputs.package == 'windows-portable') && 'windows-2022' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      VIRTUAL_ENV: ""
    steps:
      - name: Validate immutable package source SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$ ]]; then
            echo "Package source must be a full commit SHA: $SOURCE_SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Check out package verification from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-source
          fetch-depth: 1
      - name: Validate package selection
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            macos-dmg|windows-installer|windows-portable|linux-appimage) ;;
            *) echo "Unsupported package: $PACKAGE" >&2; exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Format check
        working-directory: ui
        run: cargo fmt --all --check
      - name: Install Linux desktop build dependencies
        if: ${{ inputs.package == 'linux-appimage' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev poppler-utils
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - name: Install pinned npm
        shell: bash
        run: |
          npm install --global "npm@$(cat .npm-version)"
          test "$(npm --version)" = "$(cat .npm-version)"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.5 --locked
      - name: Install locked production build dependencies
        run: uv sync --locked --extra desktop-build --extra transcription
      - name: Prepare pinned OCR models
        run: >-
          uv run --project . --locked --extra desktop-build --extra transcription
          python scripts/prepare_ocr_models.py
      - name: Build and validate macOS DMG
        if: ${{ inputs.package == 'macos-dmg' }}
        run: >-
          uv run --project . --locked --extra desktop-build --extra transcription
          python build.py --bundles dmg
      - name: Build and validate Windows installer
        if: ${{ inputs.package == 'windows-installer' }}
        run: >-
          uv run --project . --locked --extra desktop-build --extra transcription
          python build.py --bundles nsis --no-portable-zip
      - name: Build and validate Windows portable ZIP
        if: ${{ inputs.package == 'windows-portable' }}
        run: >-
          uv run --project . --locked --extra desktop-build --extra transcription
          python build.py
      - name: Build and validate Linux AppImage
        if: ${{ inputs.package == 'linux-appimage' }}
        run: >-
          uv run --project . --locked --extra desktop-build --extra transcription
          python build.py --bundles appimage
      - name: Lint active Rust targets
        working-directory: ui
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test standalone Rust workspace
        working-directory: ui
        run: cargo test --workspace
      - name: Select package artifact path
        id: artifact
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            macos-dmg) path='dist/*/OctoPus_*_arm64_macos.dmg' ;;
            windows-installer) path='dist/*/OctoPus_*_x64_win64_setup.exe' ;;
            windows-portable) path='dist/*/OctoPus_*_x64_win64_portable.zip' ;;
            linux-appimage) path='dist/*/OctoPus_*_x64_linux.AppImage' ;;
            *) echo "Unsupported package: $PACKAGE" >&2; exit 1 ;;
          esac
          shopt -s nullglob
          packages=( $path )
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one package for $PACKAGE, found ${#packages[@]}" >&2
            exit 1
          fi
          filename=${packages[0]##*/}
          # GitHub appends .zip to downloads, so keep the canonical package filename stem here.
          artifact_name=${filename%.*}
          echo "path=${packages[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$artifact_name" >> "$GITHUB_OUTPUT"
      - name: Exercise the packaged worker
        if: ${{ inputs.package != 'macos-dmg' }}
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
          ARTIFACT_PATTERN: ${{ steps.artifact.outputs.path }}
        run: |
          shopt -s nullglob
          packages=($ARTIFACT_PATTERN)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one package for $PACKAGE, found ${#packages[@]}" >&2
            exit 1
          fi
          uv run --project . --locked --extra desktop-build --extra transcription \
            python workflow-source/scripts/smoke_package.py "$PACKAGE" "${packages[0]}" \
            --source-root "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

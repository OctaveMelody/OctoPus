name: Package one desktop artifact

on:
  workflow_call:
    inputs:
      package:
        description: Package key selected by a caller workflow
        required: true
        type: string
      release_event_tag:
        description: Release tag supplied by a published-release event
        required: false
        type: string
        default: ""
      source_ref:
        description: Optional branch, tag, or commit to build
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  resolve-source:
    name: Select a published release source
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve the selected release or its nearest earlier release
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EVENT_TAG: ${{ inputs.release_event_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          selected_sha="$(git rev-parse HEAD)"

          if [[ -n "$RELEASE_EVENT_TAG" ]]; then
            if ! source_sha="$(git rev-parse --verify "refs/tags/${RELEASE_EVENT_TAG}^{commit}" 2>/dev/null)"; then
              echo "Release event tag is missing from the checkout: $RELEASE_EVENT_TAG" >&2
              exit 1
            fi
            if [[ "$source_sha" != "$selected_sha" ]]; then
              echo "Release event tag $RELEASE_EVENT_TAG does not point to $selected_sha." >&2
              exit 1
            fi
            source_tag="$RELEASE_EVENT_TAG"
            source_description="published release tag $source_tag"
          elif [[ -n "$SOURCE_REF" ]]; then
            source_sha=""
            for candidate_ref in \
              "refs/remotes/origin/${SOURCE_REF#origin/}" \
              "refs/tags/$SOURCE_REF" \
              "$SOURCE_REF"; do
              if source_sha="$(git rev-parse --verify --end-of-options "${candidate_ref}^{commit}" 2>/dev/null)"; then
                break
              fi
            done
            if [[ -z "$source_sha" ]]; then
              echo "Requested source ref does not resolve to a commit: $SOURCE_REF" >&2
              exit 1
            fi
            source_description="requested ref $SOURCE_REF"
          else
            releases_json="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
              --exclude-drafts --order desc --json tagName,publishedAt)"
            source_tag=""
            source_sha=""
            best_distance=-1

            while IFS= read -r candidate_tag; do
              [[ -n "$candidate_tag" ]] || continue
              if ! candidate_sha="$(git rev-parse --verify "refs/tags/${candidate_tag}^{commit}" 2>/dev/null)"; then
                continue
              fi

              if [[ "$candidate_sha" == "$selected_sha" ]]; then
                source_tag="$candidate_tag"
                source_sha="$candidate_sha"
                break
              fi

              if git merge-base --is-ancestor "$candidate_sha" "$selected_sha"; then
                distance="$(git rev-list --count "${candidate_sha}..${selected_sha}")"
                if (( best_distance < 0 || distance < best_distance )); then
                  source_tag="$candidate_tag"
                  source_sha="$candidate_sha"
                  best_distance="$distance"
                fi
              fi
            done < <(jq -r 'sort_by(.publishedAt) | reverse | .[].tagName' <<<"$releases_json")

            if [[ -z "$source_tag" ]]; then
              echo "No published release tag matches $selected_sha or precedes it in its history." >&2
              exit 1
            fi
            source_description="nearest published release tag $source_tag"
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Package source"
            echo "Using $source_description at \`$source_sha\`."
            if [[ -z "$SOURCE_REF" && -z "$RELEASE_EVENT_TAG" && "$source_sha" != "$selected_sha" ]]; then
              echo "The selected commit was untagged; this run fell back to the nearest earlier published release tag."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Build ${{ inputs.package }}
    needs: resolve-source
    runs-on: ${{ inputs.package == 'macos-dmg' && 'macos-26' || (inputs.package == 'windows-installer' || inputs.package == 'windows-portable') && 'windows-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      VIRTUAL_ENV: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-source.outputs.source_sha }}
          fetch-depth: 0
      - name: Validate package selection
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            macos-dmg|windows-installer|windows-portable|linux-appimage) ;;
            *) echo "Unsupported package: $PACKAGE" >&2; exit 1 ;;
          esac
      - name: Install Linux desktop build dependencies
        if: ${{ inputs.package == 'linux-appimage' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev poppler-utils
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - name: Install pinned npm
        shell: bash
        run: |
          npm install --global "npm@$(cat .npm-version)"
          test "$(npm --version)" = "$(cat .npm-version)"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.5 --locked
      - name: Install locked production build dependencies
        run: uv sync --locked --extra desktop-build --extra transcription
      - name: Build and validate macOS DMG
        if: ${{ inputs.package == 'macos-dmg' }}
        run: >-
          uv run --project . --locked --extra desktop-build --extra transcription
          python build.py --bundles dmg
      - name: Build and validate Windows installer
        if: ${{ inputs.package == 'windows-installer' }}
        run: >-
          uv run --project . --locked --extra desktop-build --extra transcription
          python build.py --bundles nsis --no-portable-zip
      - name: Build and validate Windows portable ZIP
        if: ${{ inputs.package == 'windows-portable' }}
        run: >-
          uv run --project . --locked --extra desktop-build --extra transcription
          python build.py
      - name: Build and validate Linux AppImage
        if: ${{ inputs.package == 'linux-appimage' }}
        run: >-
          uv run --project . --locked --extra desktop-build --extra transcription
          python build.py --bundles appimage
      - name: Format check
        working-directory: ui
        run: cargo fmt --all --check
      - name: Lint active Rust targets
        working-directory: ui
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test standalone Rust workspace
        working-directory: ui
        run: cargo test --workspace
      - name: Select package artifact path
        id: artifact
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            macos-dmg) path='dist/*/OctoPus_*_arm64_macos.dmg' ;;
            windows-installer) path='dist/*/OctoPus_*_x64_win64_setup.exe' ;;
            windows-portable) path='dist/*/OctoPus_*_x64_win64_portable.zip' ;;
            linux-appimage) path='dist/*/OctoPus_*_x64_linux.AppImage' ;;
            *) echo "Unsupported package: $PACKAGE" >&2; exit 1 ;;
          esac
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ inputs.package }}
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error

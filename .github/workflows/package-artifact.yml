name: Package one desktop artifact

on:
  workflow_call:
    inputs:
      package:
        description: Package key selected by a caller workflow
        required: true
        type: string
      source_sha:
        description: Immutable commit SHA selected by the caller workflow
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build ${{ inputs.package }}
    runs-on: ${{ inputs.package == 'macos-dmg' && 'xcode-27' || inputs.package == 'windows-packages' && 'windows-2022' || 'ubuntu-24.04' }}
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      VIRTUAL_ENV: ""
    steps:
      - name: Validate immutable package source SHA
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$ ]]; then
            echo "Package source must be a full commit SHA: $SOURCE_SHA" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Validate package selection
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          case "$PACKAGE" in
            macos-dmg|windows-packages|linux-appimage) ;;
            *) echo "Unsupported package: $PACKAGE" >&2; exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install Linux desktop build dependencies
        if: ${{ inputs.package == 'linux-appimage' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev poppler-utils
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - name: Install pinned npm
        shell: bash
        run: |
          npm install --global "npm@$(cat .npm-version)"
          test "$(npm --version)" = "$(cat .npm-version)"
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.5 --locked
      - name: Check out package CI runner from the workflow revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: workflow-source
          fetch-depth: 1
      - name: Build, test, and smoke-check the package
        id: package
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          python workflow-source/scripts/ci/build_package.py \
            --package "$PACKAGE" \
            --source-root "$GITHUB_WORKSPACE" \
            --stage-workflow-tools
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
      # A windows-packages run compiles once and uploads both the setup .exe and
      # the portable ZIP as separate artifacts; other packages stop after the first.
      - name: Upload the second package artifact from the same build
        if: ${{ steps.package.outputs.name_2 != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name_2 }}
          path: ${{ steps.package.outputs.path_2 }}
          if-no-files-found: error

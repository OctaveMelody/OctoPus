name: Build Windows portable ZIP

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build; empty uses the nearest published release
        required: false
        type: string
      release_tag:
        description: Existing release tag to attach this package to; leave empty for a workflow artifact only
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build Windows x64 portable ZIP
    permissions:
      contents: read
    uses: ./.github/workflows/package-artifact.yml
    with:
      package: windows-portable
      source_ref: ${{ github.event.inputs.source_ref }}

  publish:
    name: Attach the portable ZIP to the release
    if: ${{ github.event.inputs.release_tag != '' }}
    needs: package
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release-assets.yml
    with:
      release_tag: ${{ github.event.inputs.release_tag }}
      artifact_pattern: package-windows-portable

name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build; empty uses the nearest published release
        required: false
        type: string
      release_tag:
        description: Existing release tag to attach this package to; leave empty for a workflow artifact only
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve:
    permissions:
      contents: read
    uses: ./.github/workflows/resolve-package-source.yml
    with:
      source_ref: ${{ inputs.source_ref }}

  package:
    name: Build Windows x64 installer
    needs: resolve
    permissions:
      contents: read
    uses: ./.github/workflows/package-artifact.yml
    with:
      package: windows-installer
      source_sha: ${{ needs.resolve.outputs.source_sha }}

  publish:
    name: Attach the installer to the release
    if: ${{ github.event.inputs.release_tag != '' }}
    needs: [resolve, package]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release-assets.yml
    with:
      release_tag: ${{ github.event.inputs.release_tag }}
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      artifact_pattern: package-windows-installer

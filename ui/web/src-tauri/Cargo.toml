[package]
name = "octopus"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jps-document-io = { path = "../../document-io" }
jps-engine-bridge = { path = "../../engine-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

[package]
name = "octopus"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
default-run = "octopus"

[features]
console-launcher = []

[[bin]]
name = "octopus"
path = "src/main.rs"

[[bin]]
name = "octopus-cli"
path = "src/console_launcher.rs"
required-features = ["console-launcher"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jps-document-io = { path = "../../document-io" }
jps-engine-bridge = { path = "../../engine-bridge" }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
same-file = "1"
tempfile = "3"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

tauri-plugin-opener = "=2.5.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
semver = "1"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octopus"
version = "0.1.0"
description = "Evidence-driven Jianpu JPS parser and SVG renderer"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
# 1.13.0 (export.pdf): svglib + reportlab convert rendered SVG pages into a
# multi-page vector PDF; 1.14.0 (export.jpg): resvg-py rasterizes the same
# pages (pure wheel wrapping the Rust resvg renderer) and Pillow encodes the
# JPEGs. All ship pure wheels for every pinned sidecar target (linux/windows/
# macos, x86_64+arm64); the engine imports them LAZLY (ui/engine/pdf_export.py
# + jpg_export.py) so non-export ops stay dependency-free at import.
dependencies = [
    "fonttools==4.60.2",
    "pillow>=10",
    "reportlab>=4,<5",
    "resvg-py>=0.5,<1",
    "svglib>=2.2,<3",
]

[project.optional-dependencies]
transcription = [
    "rapidocr-onnxruntime==1.4.4",
]
desktop-build = [
    "pyinstaller==6.22.3",
]
pixel = [
    "pillow>=10.2.0",
    "playwright>=1.60.0",
]

[project.scripts]
octopus = "octopus.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["octopus*", "ui", "ui.engine"]

[tool.setuptools.package-data]
"octopus.assets.glyphs" = ["*.svg", "registry.json"]

"octopus.assets.fonts" = ["*.ttf", "*.json", "*.md", "licenses/*.txt", "licenses/*.pdf"]

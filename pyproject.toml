[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "re-tomato"
version = "0.1.0"
description = "Evidence-driven Jianpu JPS parser and SVG renderer"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
# 1.13.0 (export.pdf): svglib + reportlab convert rendered SVG pages into a
# multi-page vector PDF; 1.14.0 (export.jpg): resvg-py rasterizes the same
# pages (pure wheel wrapping the Rust resvg renderer) and Pillow encodes the
# JPEGs. All ship pure wheels for every pinned sidecar target (linux/windows/
# macos, x86_64+arm64); the engine imports them LAZLY (ui/engine/pdf_export.py
# + jpg_export.py) so non-export ops stay dependency-free at import.
dependencies = [
    "pillow>=10",
    "reportlab>=4,<5",
    "resvg-py>=0.5,<1",
    "svglib>=2.2,<3",
]

[project.optional-dependencies]
transcription = [
    "rapidocr-onnxruntime==1.4.4",
]
desktop-build = [
    "pyinstaller==6.22.3",
]
pixel = [
    "pillow>=10.2.0",
    "playwright>=1.60.0",
]
dev = [
    "mypy>=1.13",
    "hypothesis>=6.100",
    "pillow>=10.2.0",
    "playwright>=1.60.0",
    "pytest>=8",
    "ruff>=0.9",
]

[project.scripts]
re-tomato = "re_tomato.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["re_tomato*", "audit*"]

[tool.setuptools.package-data]
"re_tomato.assets.glyphs" = ["*.svg", "registry.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "evidence: offline probe and evidence regressions",
    "corpus: authoritative raw or pixel corpus gates",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tools/probes"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
# Type checking follows the desktop worker's Python 3.12 environment/NumPy stubs.
# Source syntax stays Python 3.11-compatible (Ruff's target and the CI runtime matrix).
python_version = "3.12"
# re_tomato lives under src/; audit/ (repo root) imports it, so mypy needs the path
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
